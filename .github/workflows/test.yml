name: Module 10 CI and Docker Hub Deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit integration and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: module10_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d module10_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:testpassword@localhost:5432/module10_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:testpassword@localhost:5432/module10_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run all tests against real PostgreSQL
        run: python -m pytest --junitxml=test-results/junit.xml --cov-report=xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            coverage.xml

  build_scan_deploy:
    name: Build scan and deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LOCAL_IMAGE: module10-calculator:ci
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v6
      - name: Build runtime image
        run: docker build --pull --target runtime -t "$LOCAL_IMAGE" .
      - name: Scan runtime image with Grype
        uses: anchore/scan-action@v7
        with:
          image: module10-calculator:ci
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Smoke test built image with PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker network create module10-ci
          docker run -d --name module10-ci-db --network module10-ci \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=smokepass \
            -e POSTGRES_DB=module10_smoke postgres:16
          ready=false
          for attempt in {1..30}; do
            if docker exec module10-ci-db pg_isready -h 127.0.0.1 -U postgres -d module10_smoke; then
              ready=true; break
            fi
            sleep 2
          done
          test "$ready" = true
          docker run -d --name module10-ci-app --network module10-ci \
            -p 127.0.0.1:8010:8000 \
            -e DATABASE_URL=postgresql+psycopg://postgres:smokepass@module10-ci-db:5432/module10_smoke \
            "$LOCAL_IMAGE"
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors --connect-timeout 2 --max-time 5 http://localhost:8010/health
          curl --fail http://localhost:8010/
      - name: Check deployment configuration
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Set the DOCKERHUB_USERNAME repository variable'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Set the DOCKERHUB_TOKEN repository secret'; exit 1; }
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push the tested and scanned image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          image="$DOCKERHUB_USERNAME/module10-calculator"
          docker tag "$LOCAL_IMAGE" "$image:latest"
          docker tag "$LOCAL_IMAGE" "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          docker push "$image:latest"
          echo "### Docker Hub deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "https://hub.docker.com/r/$DOCKERHUB_USERNAME/module10-calculator" >> "$GITHUB_STEP_SUMMARY"
          echo "Published tags: latest and $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs module10-ci-app || true
          docker rm -f module10-ci-app module10-ci-db || true
          docker network rm module10-ci || true
