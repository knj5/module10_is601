name: module10_is601
services:
  web:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:module10local@db:5432/module10_db
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: module10local
      POSTGRES_DB: module10_db
    volumes:
      - module10_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d module10_db"]
      interval: 5s
      timeout: 5s
      retries: 20
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "127.0.0.1:5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: module10admin
    volumes:
      - module10_pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
  test-db:
    image: postgres:16
    profiles: [test]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: module10test
      POSTGRES_DB: module10_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d module10_test"]
      interval: 5s
      timeout: 5s
      retries: 20
  test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:module10test@test-db:5432/module10_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:module10test@test-db:5432/module10_test
    depends_on:
      test-db:
        condition: service_healthy
volumes:
  module10_postgres_data:
  module10_pgadmin_data:
